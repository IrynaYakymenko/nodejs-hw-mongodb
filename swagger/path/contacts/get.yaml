tags:
  - Contacts
summary: Get paginated contacts
operationId: getContacts
description: 'Get a paginated list of user contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
responses:
  '200':
    description: 'Get all contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - data
            - pagination
          properties:
            status:
              type: integer
              example: 200
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
            pagination:
              type: object
              properties:
                total:
                  type: integer
                  example: 35
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
  '401':
    $ref: '../../components/responses/401.yaml'
