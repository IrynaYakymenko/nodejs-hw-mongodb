tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: 'Delete contact by id for authenticated user'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '68713df9fbad00af66920c5f'
responses:
  '200':
    description: 'Contact deleted successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact deleted successfully
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: 'Contact not found'
